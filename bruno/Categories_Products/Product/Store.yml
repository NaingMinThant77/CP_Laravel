info:
  name: Store
  type: http
  seq: 2

http:
  method: POST
  url: "{{DEV_API}}/products"
  body:
    type: multipart-form
    data:
      - name: name
        type: text
        value: Product 1
      - name: category_id
        type: text
        value: "1"
      - name: description
        type: text
        value: This is description
